name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows server
    needs: validate
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Configure Git safe directory
        shell: powershell
        run: git config --global --add safe.directory "*"

      - name: Check out latest main commit
        uses: actions/checkout@v4

      - name: Deploy latest main commit
        shell: powershell
        run: . "$env:GITHUB_WORKSPACE\scripts\deploy.ps1"
