name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows server
    needs: validate
    runs-on: [self-hosted, windows, x64]
    environment: production
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4
        with:
          path: ci-source

      - name: Pull, build, and restart production
        shell: powershell
        env:
          PM2_HOME: C:\Users\User.WIN-P4GS0JVSN3R\.pm2
        run: >-
          & "$env:GITHUB_WORKSPACE\ci-source\scripts\deploy.ps1"
          -ProjectPath "E:\websites\proposalmaker\HT-PF"
          -Branch "main"
          -AppName "ht-pf-production"